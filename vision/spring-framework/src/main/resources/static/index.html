<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Cloud Vision API with Spring code sample</title>
</head>
<body>

<div>
    <h1>Image Label Annotations</h1>
    <p>Returns labels classifying the content of the image:</p>
    <form action="/extractLabels">
        Web URL of image to analyze:
        <input type="text"
               name="imageUrl"
               value="https://storage.googleapis.com/cloud-samples-data/vision/label/wakeupcat.jpg"/>
        <input type="submit"/>
    </form>
</div>

<div>
    <h1>Text Extraction</h1>
    <p>Read and extract the text from the image:</p>
    <form action="/extractText">
        Web URL of image to analyze:
        <input type="text"
               name="imageUrl"
               value="https://storage.googleapis.com/cloud-samples-data/vision/text/screen.jpg"/>
        <input type="submit" />
    </form>
</div>

</body>
</html>
